name: backend-ci
on:
  push:
    branches: [BackendApp]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [BackendApp]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify
