components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshTokenAuth:
      type: http
      scheme: bearer
      description: Stateless refresh token (DEC-08).
    guestTokenAuth:
      type: http
      scheme: bearer
      description: Guest order tracking token.
    resetTokenAuth:
      type: http
      scheme: bearer
      description: Reset token; transport details are not specified in SRS.
    providerSignatureAuth:
      type: http
      scheme: ProviderSignature
      description: Provider signature; wire format is not specified in SRS.
  schemas:
    Error:
      type: object
      required: [code, messageAr, messageEn, traceId, details]
      properties:
        code:
          type: string
        messageAr:
          type: string
        messageEn:
          type: string
        traceId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: EGP amount string with exactly two decimal places (DEC-13).
    Currency:
      type: string
      const: EGP
    CheckoutQuoteResponse:
      type: object
      required: [subtotal, discount, shipping, tax, grandTotal, currency]
      properties:
        subtotal:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        grandTotal:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        warehouseCandidate:
          type: string
          description: Candidate warehouse identifier for display only; not an allocation.
    CheckoutOrderResponse:
      type: object
      required: [orderId, orderNumber, status, paymentStatus, currency, grandTotal, reservationExpiresAt]
      properties:
        orderId:
          type: string
        orderNumber:
          type: string
        status:
          type: string
          const: PENDING
        paymentStatus:
          type: string
          const: PENDING
        currency:
          $ref: '#/components/schemas/Currency'
        grandTotal:
          $ref: '#/components/schemas/Money'
        reservationExpiresAt:
          type: string
          format: date-time
    PaymentAttemptResponse:
      type: object
      required: [paymentId, paymentStatus]
      properties:
        paymentId:
          type: string
        paymentStatus:
          type: string
          const: PENDING
      description: Provider-specific response fields remain unresolved under OPEN-01.
    CheckoutQuoteRequest:
      type: object
      additionalProperties: false
      required: [cartId, shippingAddress]
      properties:
        cartId:
          type: string
        shippingAddress:
          type: object
          required: [countryCode, governorateId, cityId, latitude, longitude]
          properties:
            countryCode:
              type: string
              const: EG
            governorateId:
              type: string
            cityId:
              type: string
            latitude:
              type: number
            longitude:
              type: number
        couponCode:
          type: string
    CheckoutOrderRequest:
      type: object
      description: grandTotal, status, and warehouseId are prohibited; if sent reject with VALIDATION_ERROR.
      additionalProperties: false
      required: [cartId, customer, shippingAddress, paymentMethod]
      properties:
        cartId:
          type: string
        customer:
          type: object
          additionalProperties: true
        shippingAddress:
          type: object
          additionalProperties: true
        paymentMethod:
          type: string
          enum: [COD, CARD, WALLET]
        couponCode:
          type: string
    PaymentAttemptRequest:
      type: object
      additionalProperties: false
      required: [method, provider]
      properties:
        method:
          type: string
          enum: [CARD, WALLET, COD]
        provider:
          type: string
      description: Detailed provider fields are unresolved under OPEN-01.
  responses:
    VALIDATION_ERROR:
      description: "بيانات الإدخال غير صحيحة"
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              code:
                const: VALIDATION_ERROR
              messageAr:
                const: "بيانات الإدخال غير صحيحة"
              messageEn:
                const: "Invalid input data"
    EMAIL_OR_PHONE_REQUIRED:
      description: "مطلوب بريد إلكتروني أو رقم هاتف"
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              code:
                const: EMAIL_OR_PHONE_REQUIRED
              messageAr:
                const: "مطلوب بريد إلكتروني أو رقم هاتف"
              messageEn:
                const: "Email or phone is required"
    UNAUTHENTICATED:
      description: "يجب تسجيل الدخول"
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
            properties:
              code:
                const: UNAUTHENTICATED
              messageAr:
                const: "يجب تسجيل الدخول"
              messageEn:
                const: "Authentication required"
    INVALID_CREDENTIALS:
      description: "البريد الإلكتروني أو كلمة المرور غير صحيحة"
