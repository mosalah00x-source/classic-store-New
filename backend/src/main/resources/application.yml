server:
  error:
    include-message: never
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/classic_store}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  flyway:
    enabled: true
    schemas: public,store
    default-schema: public
    create-schemas: true
security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    access-ttl: PT15M
    refresh-ttl: P7D
  password-reset:
    fingerprint-secret-base64: ${PASSWORD_RESET_FINGERPRINT_SECRET_BASE64:}
  mail:
    from: ${MAIL_FROM:no-reply@classic-store.local}
    reset-url: ${PASSWORD_RESET_URL:https://store.example.invalid/reset-password}
