server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/classic_store}
    username: ${JDBC_USER:postgres}
    password: ${JDBC_PASSWORD:postgres}
  flyway:
    enabled: true
    schemas: public,store
    default-schema: public
    create-schemas: true
security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    access-ttl: PT15M
    refresh-ttl: P7D
  password-reset:
    fingerprint-secret-base64: ${PASSWORD_RESET_FINGERPRINT_SECRET_BASE64:}
  mail:
    from: ${MAIL_FROM:no-reply@classic-store.local}
    reset-url: ${PASSWORD_RESET_URL:https://store.example.invalid/reset-password}
